services:
  - type: web
    name: mkrm-enterprises-preview
    runtime: node
    rootDir: MKRM-ENTERPRISES-public-preview
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
